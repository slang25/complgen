name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
        
    - name: Configure build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install shells (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        # Install fish and zsh from Ubuntu repositories
        sudo apt-get update
        sudo apt-get install -y fish zsh
        
        # Install PowerShell using direct download to avoid esm.ubuntu.com
        wget -q "https://github.com/PowerShell/PowerShell/releases/download/v7.4.0/powershell_7.4.0-1.deb_amd64.deb"
        sudo dpkg -i powershell_7.4.0-1.deb_amd64.deb || true
        sudo apt-get install -f -y
        
    - name: Install shells (macOS)
      if: runner.os == 'macOS'
      run: |
        # Install PowerShell and other shells on macOS using Homebrew
        brew install --cask powershell
        brew install fish zsh
        
    - name: Verify shell installations
      run: |
        pwsh -v
        if [ "$RUNNER_OS" != "Windows" ]; then
          fish --version
          zsh --version
        fi
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r e2e/requirements.txt
        
    - name: Run Rust unit tests
      run: cargo test --verbose
      
    - name: Build complgen binary
      run: cargo build --release
      
    - name: Run e2e tests
      run: pytest e2e/ --verbose